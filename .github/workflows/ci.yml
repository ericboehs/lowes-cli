name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ruby:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: false
      - name: Syntax check
        run: |
          for f in $(find bin lib web.rb -type f \( -name "*.rb" -o -name lowes \)); do
            ruby -c "$f"
          done
      - name: Run Minitest
        run: rake test

  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pyworker
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      # Pinned because unpinned is how this job broke: 0.16 widened the default
      # rule set and 18 findings that had always been there became errors
      # overnight. Temporary — the follow-up PR fixes those and unpins.
      - run: pip install ruff==0.15.12
      - run: ruff check .
      - run: python -m compileall -q .

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
      - name: Scan full history
        run: gitleaks detect --redact -v --exit-code=1 --no-banner
