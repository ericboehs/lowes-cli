[project]
name = "lowes-cli-pyworker"
version = "0.1.0"
description = "Python worker for the lowes CLI — drives Playwright to scrape Lowe's order history, quotes, and prices."
requires-python = ">=3.10"
dependencies = [
    "playwright>=1.49,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["fetch.py", "login.py"]
